services:
  - type: web
    name: therelationshipresume
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: resume-db
          property: connectionString
      - key: RESUME_INTEGRATION_SECRET
        sync: false

databases:
  - name: resume-db
    plan: basic-256mb
